name: Build my extension

on:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1

      - name: Set up Java
        uses: actions/setup-java@de7274f081f381c8f8158605e0321c36c376e2e6
        with:
          java-version: 25
          distribution: temurin

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@3f5f9adaf7d9fecd50b5935e54106014257a94e6

      - name: Create my own signing key
        run: |
          keytool -genkeypair -keystore signingkey.jks -storepass mypass123 \
            -keypass mypass123 -alias myalias -keyalg RSA -keysize 2048 \
            -validity 10000 -dname "CN=me"

      - name: Build only HentaiMilfToon
        env:
          ALIAS: myalias
          KEY_STORE_PASSWORD: mypass123
          KEY_PASSWORD: mypass123
        run: ./gradlew :src:en:hentaimilftoon:assembleRelease

      - name: Publish to repo branch
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          pip install -U protobuf
          B=src/en/hentaimilftoon/build
          mkdir -p out/apk out/jar
          cp $B/outputs/apk/release/*.apk out/apk/
          cp $B/outputs/jar/release/*.jar out/jar/
          cp $B/keiyoushi-source-info.json out/source-info.json
          FP=$(keytool -list -v -keystore signingkey.jks -storepass mypass123 -alias myalias | grep 'SHA256:' | head -n 1 | sed 's/.*SHA256: //' | tr -d ':' | tr 'A-F' 'a-f')
          export FP
          export BASE="https://raw.githubusercontent.com/${GITHUB_REPOSITORY}/repo"
          export ICON="https://raw.githubusercontent.com/${GITHUB_REPOSITORY}/main/core/src/main/res/mipmap-xhdpi/ic_launcher.png"
          export PYTHONPATH=.github/scripts
          python3 - <<'EOF'
          import json, os, glob, gzip
          import index_pb2
          from google.protobuf import json_format
          info = json.load(open('out/source-info.json'))
          apk = os.path.basename(glob.glob('out/apk/*.apk')[0])
          jar = os.path.basename(glob.glob('out/jar/*.jar')[0])
          base = os.environ['BASE']
          ext = index_pb2.Extension(
              name=info['name'],
              packageName=info['packageName'],
              resources=index_pb2.Resources(
                  iconUrl=os.environ['ICON'],
                  apkUrl=f"{base}/apk/{apk}",
                  jarUrl=f"{base}/jar/{jar}",
              ),
              extensionLib=info['extensionLib'],
              versionCode=info['versionCode'],
              versionName=info['versionName'],
              contentWarning=info['contentWarning'],
              sources=[
                  index_pb2.Source(
                      id=int(s['id']), name=s['name'], language=s['lang'],
                      homeUrl=s['baseUrl'], mirrorUrls=s.get('mirrorUrls', []),
                  ) for s in info['sources']
              ],
          )
          index = index_pb2.Index(
              name="My Repo",
              badgeLabel="MY",
              signingKey=os.environ['FP'],
              contact=index_pb2.Contact(website="https://github.com"),
              extensionList=index_pb2.ExtensionList(extensions=[ext]),
          )
          open('out/index.json', 'w').write(json_format.MessageToJson(
              index, always_print_fields_with_no_presence=False,
              preserving_proto_field_name=True))
          open('out/index.pb', 'wb').write(
              gzip.compress(index.SerializeToString(deterministic=True), mtime=0))
          EOF
          rm out/source-info.json
          cd out
          git init -b repo
          git config user.email "bot@users.noreply.github.com"
          git config user.name "bot"
          git add .
          git commit -m "Publish extension"
          git remote add origin "https://x-access-token:${GH_TOKEN}@github.com/${GITHUB_REPOSITORY}.git"
          git push -f origin repo
